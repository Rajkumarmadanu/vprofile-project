- name: Setup Tomcat8 & Deploy Artifact
  hosts: appsrvgrp
  become: yes

  tasks:

    - name: Download WAR from Nexus
      get_url:
        url: "http://{{ USER }}:{{ PASS }}@{{ nexusip }}:8081/repository/{{ reponame }}/QA/{{ artifactid }}/{{ build }}/{{ vprofile_version }}"
        dest: "/tmp/{{ vprofile_version }}"
      register: wardeploy
      tags:
        - deploy


    - name: Check if ROOT app already exists
      stat:
        path: /usr/local/tomcat8/webapps/ROOT
      register: artifact_stat
      tags:
        - deploy


    - name: Stop Tomcat
      service:
        name: tomcat
        state: stopped
      tags:
        - deploy


    - name: Backup current ROOT
      block:

        - name: Create TAR backup with timestamp
          archive:
            path: /usr/local/tomcat8/webapps/ROOT
            dest: "/opt/ROOT_{{ ansible_date_time.iso8601 }}.tgz"
          when: artifact_stat.stat.exists
          register: archive_info

        - name: Copy current ROOT to old_ROOT
          shell: cp -r ROOT old_ROOT
          args:
            chdir: /usr/local/tomcat8/webapps/
          when: artifact_stat.stat.exists

        - name: Delete existing ROOT and ROOT.war
          file:
            path: "{{ item }}"
            state: absent
          loop:
            - /usr/local/tomcat8/webapps/ROOT
            - /usr/local/tomcat8/webapps/ROOT.war
          when: artifact_stat.stat.exists

        - name: Deploy new WAR file
          copy:
            src: "/tmp/{{ vprofile_version }}"
            dest: "/usr/local/tomcat8/webapps/ROOT.war"
            remote_src: yes
          register: deploy_info

      rescue:

        - name: Restore previous ROOT
          shell: cp -r old_ROOT ROOT
          args:
            chdir: /usr/local/tomcat8/webapps/

        - name: Start Tomcat (restore case)
          service:
            name: tomcat
            state: started


    - name: Start Tomcat (successful deploy)
      service:
        name: tomcat
        state: started
      when: deploy_info.changed | default(false)
      tags:
        - deploy


    - name: Wait until ROOT directory is extracted
      wait_for:
        path: /usr/local/tomcat8/webapps/ROOT
      tags:
        - deploy


  handlers:
    - name: Restart Tomcat
      service:
        name: tomcat
        state: restarted